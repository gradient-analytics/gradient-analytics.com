<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grady – Internal Console</title>
    <link rel="stylesheet" href="grady.css" />
</head>

<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Grady Internal Console</h1>
            <p>Private RAG environment — not publicly linked</p>
        </div>

        <div id="chat-window" class="chat-window"></div>

        <div class="input-row">
            <input id="chat-input" type="text" placeholder="Ask Grady a question..." />
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script src="grady.js"></script>
</body>
</html>
